<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0px); opacity: 0.25; } 50% { opacity: 0.5; } 100% { transform: translateY(210px); opacity: 0.05; } }
    .cursor { animation: blink 1.1s infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .scanline { animation: scan 5s linear infinite; }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="848" height="258" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="38" width="846" height="220" rx="12" fill="url(#grid)"/>

  <!-- Animated Scanline -->
  <rect class="scanline" x="2" y="38" width="846" height="2" fill="#00f5d4" opacity="0.25"/>

  <!-- Terminal Title Bar -->
  <path d="M 1 15 Q 1 1 15 1 L 835 1 Q 849 1 849 15 L 849 38 L 1 38 Z" fill="#0f172a"/>
  <line x1="1" y1="38" x2="849" y2="38" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="20" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="20" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="20" r="5.5" fill="#10b981"/>
  <text x="84" y="24" class="mono" font-size="12" fill="#94a3b8">araf@dev: ~/mohammed-Araf — nvim README.md</text>
  <rect x="735" y="10" width="96" height="20" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <circle class="pulse" cx="748" cy="20" r="3.5" fill="#00f5d4"/>
  <text x="758" y="24" class="mono" font-size="10.5" font-weight="700" fill="#00f5d4">ONLINE</text>

  <!-- Prompt Line -->
  <text x="34" y="72" class="mono" font-size="13" fill="#00f5d4">❯</text>
  <text x="50" y="72" class="mono" font-size="13" fill="#94a3b8">whoami --verbose</text>

  <!-- Main Name -->
  <text x="34" y="122" class="sans" font-size="44" font-weight="800" letter-spacing="1.5" fill="url(#nameGrad)">MOHAMMED ARAF</text>
  <rect class="cursor" x="458" y="88" width="12" height="36" rx="2" fill="#00f5d4"/>

  <!-- Subtitle -->
  <text x="34" y="154" class="mono" font-size="14.5" fill="#cbd5e1">Full-Stack Engineer  ·  Hardware Innovator  ·  Edge AI  ·  VFX Artist</text>
  <text x="34" y="178" class="mono" font-size="12.5" fill="#64748b">// B.Tech CS&amp;T @ Dayananda Sagar University  ·  Bangalore, India</text>

  <!-- Highlight Pills -->
  <rect x="34" y="200" width="182" height="26" rx="6" fill="#0f172a" stroke="#00f5d4" stroke-width="1"/>
  <text x="46" y="217" class="mono" font-size="11" font-weight="700" fill="#00f5d4">PATENT: UFI MODULAR</text>

  <rect x="228" y="200" width="174" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="240" y="217" class="mono" font-size="11" font-weight="700" fill="#38bdf8">EUREKATHON 3RD PLACE</text>

  <rect x="414" y="200" width="194" height="26" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="426" y="217" class="mono" font-size="11" font-weight="700" fill="#c084fc">NASA SPACE APPS NOMINEE</text>

  <!-- Right Side Decorative Terminal Status -->
  <rect x="652" y="64" width="168" height="162" rx="10" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <text x="668" y="88" class="mono" font-size="11" fill="#38bdf8">SYSTEM TELEMETRY</text>
  <line x1="668" y1="96" x2="804" y2="96" stroke="#1e293b" stroke-width="1"/>
  <text x="668" y="116" class="mono" font-size="11" fill="#94a3b8">REPOS   <tspan fill="#f8fafc">12+</tspan></text>
  <text x="668" y="136" class="mono" font-size="11" fill="#94a3b8">PATENT  <tspan fill="#00f5d4">PUBLISHED</tspan></text>
  <text x="668" y="156" class="mono" font-size="11" fill="#94a3b8">VFX     <tspan fill="#f8fafc">2 FILMS</tspan></text>
  <text x="668" y="176" class="mono" font-size="11" fill="#94a3b8">STACK   <tspan fill="#38bdf8">TS/PY/KT</tspan></text>
  <text x="668" y="206" class="mono" font-size="10.5" fill="#64748b">STATUS: <tspan fill="#10b981">BUILDING</tspan></text>
</svg>
